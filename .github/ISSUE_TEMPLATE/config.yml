# Blank issues stay on deliberately. Discussions are off, so issues are the only public
# surface, and a question or a suggestion has to have somewhere to go that is not the bug
# form.
blank_issues_enabled: true
contact_links:
  - name: Security problem
    url: https://github.com/Laeresh/CSVM/security/advisories/new
    about: >-
      Report a vulnerability privately instead of opening an issue. See SECURITY.md for
      what is in scope.
