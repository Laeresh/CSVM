# coturn for CSVM: STUN and TURN on 3478 (UDP and TCP), relayed traffic on a small UDP range.
# The secret, the realm and the public address are passed on coturn's command line by
# docker-compose.yml (or the systemd unit), so this file holds no secret.

listening-port=3478
fingerprint

# Credentials are minted by the master server: user "<expiry>:<label>", password the Base64
# HMAC-SHA1 of the user under static-auth-secret. No static user exists.
use-auth-secret

# The relay range. Each relayed guest takes one port here for the length of its match, so 41
# ports serve 41 relayed guests at once; widen it (and the firewall rule) if that is ever short.
min-port=49160
max-port=49200

# Plain STUN/TURN only; the game's WebRTC encrypts its own traffic end to end.
no-tls
no-dtls
no-cli

# Never relay into the server's own networks or the loopback, so the TURN server cannot be used to
# reach anything behind it.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Bounds: allocations per user name, and the total bandwidth coturn will relay (bytes per second).
user-quota=4
total-quota=100
max-bps=2000000

stale-nonce=600
log-file=stdout
simple-log
